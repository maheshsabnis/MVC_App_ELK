# Reads the newline-delimited OTLP JSON that the OpenTelemetry Collector's file exporter
# writes for the "logs" pipeline (see observability/otel-collector.yaml), flattens each
# OTLP LogRecord out of its resourceLogs/scopeLogs/logRecords nesting, and indexes it into
# Elasticsearch. This is the one signal routed through Logstash; traces and metrics still
# go straight from the Collector to Elasticsearch (see observability/otel-collector.yaml).

input {
  file {
    path => "/otel-output/logs*.jsonl*"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-otel-logs"
    # The file input already splits the file into discrete lines itself (one line per
    # ExportLogsServiceRequest) before handing each to the codec, so the codec here only
    # needs to decode one already-isolated JSON document per call. `json_lines` is for
    # stream inputs (tcp/udp/stdin) that haven't split lines yet; used on a `file` input it
    # buffers forever waiting for a trailing delimiter that was already stripped, and no
    # event is ever decoded.
    codec => json {
      ecs_compatibility => disabled
    }
  }
}

filter {
  # Each line is one ExportLogsServiceRequest carrying many resources, scopes and log
  # records (the Collector batches up to `send_batch_size` records per export, so a line
  # is routinely ~870KB holding 512 records).
  #
  # This fan-out is deliberately NOT done with nested `split` filters. `split` deep-copies
  # the entire event once per array element, and the copy is made while the field still
  # holds the whole array -- so one 870KB line became 512 copies of itself, several hundred
  # megabytes, and Logstash died with OutOfMemoryError before indexing anything. Emitting
  # each record as a fresh, small event via new_event_block keeps memory proportional to
  # the line rather than to (line x records).
  ruby {
    code => '
      # Decodes an OTLP AnyValue (e.g. {"stringValue" => "x"}, {"intValue" => "5"}) into a
      # plain Ruby value. OTLP JSON always wraps scalars this way.
      def otlp_any_value(any_value)
        return nil if any_value.nil?
        if any_value.key?("stringValue")
          any_value["stringValue"]
        elsif any_value.key?("intValue")
          any_value["intValue"].to_i
        elsif any_value.key?("doubleValue")
          any_value["doubleValue"]
        elsif any_value.key?("boolValue")
          any_value["boolValue"]
        elsif any_value.key?("arrayValue")
          (any_value.dig("arrayValue", "values") || []).map { |v| otlp_any_value(v) }
        elsif any_value.key?("kvlistValue")
          otlp_attrs_to_hash(any_value.dig("kvlistValue", "values"))
        else
          nil
        end
      end

      # Attribute names the app has since renamed, mapped old => current. Elasticsearch
      # expands dots in a field name into an object path, so a record carrying the old
      # "http.route.matched" forces log_attributes.http.route to be an *object*, which then
      # rejects every record carrying the current "http.route" string (and vice versa) with
      # a document_parsing_exception. MVC_App/Middleware/RequestLogging.cs renamed the
      # attribute to "http.route_matched" for exactly this reason, but the older records
      # already sitting in otel-output still use the pre-rename key, so normalise on read.
      # A method rather than a constant: this filter body is evaluated once per event, so a
      # constant assignment here re-initialises it every time and floods the log with
      # "already initialized constant" warnings.
      def normalize_attribute_key(key)
        key == "http.route.matched" ? "http.route_matched" : key
      end

      # OTLP attributes are a list of {"key" => ..., "value" => AnyValue}; turn that into
      # a flat hash keyed by attribute name.
      def otlp_attrs_to_hash(attributes)
        (attributes || []).each_with_object({}) do |kv, hash|
          key = normalize_attribute_key(kv["key"])
          # A record that somehow carries both spellings keeps the current one.
          next if hash.key?(key) && key != kv["key"]
          hash[key] = otlp_any_value(kv["value"])
        end
      end

      (event.get("resourceLogs") || []).each do |resource_logs|
        resource_attrs = otlp_attrs_to_hash(resource_logs.dig("resource", "attributes"))
        service_name = resource_attrs["service.name"]
        deployment_environment = resource_attrs["deployment.environment.name"]

        (resource_logs["scopeLogs"] || []).each do |scope_logs|
          scope_name = scope_logs.dig("scope", "name")

          (scope_logs["logRecords"] || []).each do |record|
            out = LogStash::Event.new
            out.set("message", otlp_any_value(record["body"]) || "")
            out.set("severity_text", record["severityText"])
            out.set("severity_number", record["severityNumber"])
            out.set("trace_id", record["traceId"])
            out.set("span_id", record["spanId"])
            out.set("log_attributes", otlp_attrs_to_hash(record["attributes"]))
            out.set("resource_attributes", resource_attrs)
            out.set("service_name", service_name)
            out.set("deployment_environment", deployment_environment)
            out.set("scope_name", scope_name)

            time_unix_nano = record["timeUnixNano"] || record["observedTimeUnixNano"]
            if time_unix_nano
              out.set("@timestamp", LogStash::Timestamp.at(time_unix_nano.to_i / 1_000_000_000.0))
            end

            new_event_block.call(out)
          end
        end
      end

      # The raw ExportLogsServiceRequest wrapper is not itself a log line. Everything useful
      # has been emitted above, so drop it (this also covers empty batches).
      event.cancel
    '
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mvcapp-logs-%{+YYYY.MM.dd}"
  }
}
